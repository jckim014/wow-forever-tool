# Collects WoW Forever auction data from the Blizzard API (collector/collect.mjs). Started every 15 minutes by a Google
# Apps Script timer (collector/apps-script-timer.gs) because GitHub never fires the schedule below in this repo.
# Each run downloads only houses whose data changed since the last run; new data is uploaded as an artifact
# named snapshot-<time> (kept 90 days) for the sync script on Josh's PC to download to F:.
# A failed run (any problem the collector finds) makes GitHub email the repo owner.
# Secrets: BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, TOKEN_CACHE_KEY (encrypts the cached access token).
name: Collect auctions

on:
  schedule:
    - cron: '6,26,46 * * * *' # Blizzard refreshes at about :22 each hour
  workflow_dispatch:
    inputs:
      test_failure:
        description: 'Fail this run on purpose after collecting (checks that the failure email arrives)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: collector
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test collector
        run: node --test collector/*.test.mjs
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: collector-state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-
      - name: Collect
        id: collect
        run: node collector/collect.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          TOKEN_CACHE_KEY: ${{ secrets.TOKEN_CACHE_KEY }}
          STATE_DIR: collector-state
          OUT_DIR: collector-out
      - name: Upload snapshot
        if: always() && steps.collect.outputs.snapshot != ''
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-${{ steps.collect.outputs.snapshot }}
          path: collector-out/
          retention-days: 90
          compression-level: 0 # files are already gzipped
          if-no-files-found: error
      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: collector-state
          key: collector-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test failure (only when asked)
        if: inputs.test_failure
        run: |
          echo "::error::Test failure requested from the Run workflow button. Collecting itself worked; nothing is wrong."
          exit 1
